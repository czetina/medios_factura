<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Facturación de Proveedores{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'facturas:buscar_orden' %}">
                📄 Facturación de Proveedores &mdash; Órdenes de Compra
            </a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-light btn-sm" href="{% url 'facturas:listado_facturas_recibidas' %}">
                    Facturas recibidas
                </a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'facturas:liquidar_clientes' %}">
                    Liquidar clientes
                </a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'facturas:listado_liquidaciones' %}">
                    Liquidaciones guardadas
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
